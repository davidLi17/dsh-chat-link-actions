name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node --check index.js && node --check client.js && node --check cli.js
      - name: Unit tests
        run: npm test
      - name: Manifest sanity
        shell: bash
        run: node -e "const p=require('./package.json');if(!p.dsh?.bundle?.patch||!p.dsh?.client?.inject?.length)process.exit(1)"
      - name: Packed files exist
        shell: bash
        run: for f in index.js client.js cordis.patch.yml README.md LICENSE; do test -f "$f"; done
      - name: PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          node test/windows-shell.test.mjs
      - name: PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          node test/windows-shell.test.mjs
